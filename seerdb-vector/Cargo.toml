[package]
name = "seerdb-vector"
version = "0.0.0"
edition = "2021"
authors = ["OmenDB Inc."]
description = "Vector-optimized storage layer built on seerdb"
publish = false

[lib]
name = "seerdb_vector"
path = "src/lib.rs"

[dependencies]
# Core storage engine
seerdb = "0.0.2"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

# Random number generation (for sampling hash initialization)
rand = "0.8"
smallvec = "1.15.1"

[dev-dependencies]
tempfile = "3.8"
