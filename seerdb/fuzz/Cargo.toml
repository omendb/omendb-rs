[package]
name = "seerdb-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tempfile = "3.14"
bytes = "1.10"

[dependencies.seerdb]
path = ".."

[[bin]]
name = "sstable_parse"
path = "fuzz_targets/sstable_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wal_parse"
path = "fuzz_targets/wal_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vlog_parse"
path = "fuzz_targets/vlog_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "db_operations"
path = "fuzz_targets/db_operations.rs"
test = false
doc = false
bench = false
