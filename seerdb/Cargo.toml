[package]
name = "seerdb"
version = "0.0.1-alpha"
edition = "2021"
license = "AGPL-3.0"
authors = ["seerdb contributors"]
description = "Research-grade storage engine with learned data structures"
repository = "https://github.com/omendb/seerdb"
readme = "README.md"
keywords = ["database", "lsm", "storage", "learned-index", "embedded"]
categories = ["database-implementations", "data-structures"]
exclude = [
    "ai/",
    ".github/",
    "fuzz/",
    "AGENTS.md",
    "CLAUDE.md",
    "CONTEXT.md",
    "storage-engine-research.md",
]

[dependencies]
# Core dependencies
thiserror = "2.0"
bytes = "1.9"

# Async I/O (tokio default, secure)
tokio = { version = "1.41", features = ["full"] }

# WAL and data integrity (hardware-accelerated CRC32C)
crc32c = "0.6"

# Memtable (concurrent skiplist + lock-free atomic swap)
crossbeam-skiplist = "0.1"
crossbeam-channel = "0.5"
arc-swap = "1.7"

# ML for learned bloom filters (prototype phase)
smartcore = "0.3"  # Decision trees, good performance
rand = "0.8"

# Hashing
twox-hash = "2.0"   # For bloom filters (keep - industry standard)
foldhash = "0.1"    # For partitioning (2x faster than xxhash on small keys)

# Serialization
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
varint-rs = "2.2"  # Optimized varint encoding (fjall uses this)

# Compression
lz4_flex = "0.11"    # Fast LZ4 compression (fjall uses this, +30-40% performance)
zstd = "0.13"        # High-ratio ZSTD compression (better for vectors/embeddings)

# Caching
quick_cache = "0.6"  # Optimized caching library (fjall uses this)

# Metrics and observability
hdrhistogram = "7.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sysinfo = "0.29"  # System information (disk space, memory, etc.)

# Optional baseline systems for benchmarking (only compiled when baseline-benchmarks feature is enabled)
rocksdb = { version = "0.22", optional = true }
sled = { version = "0.34", optional = true }
fjall = { version = "2.3", optional = true }
anyhow = "1.0.100"
tikv-jemallocator = "0.6.1"

# Optional cloud storage support (S3, GCS, Azure)
object_store = { version = "0.11", optional = true, default-features = false, features = ["aws", "gcp", "azure"] }
url = { version = "2.5", optional = true }
futures = { version = "0.3", optional = true }
parking_lot = "0.12.5"
dashmap = "6.1.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.6"
tempfile = "3.14"
rand = "0.8"              # Random data generation for soak tests

# Stress testing
sysinfo = "0.29"          # Resource monitoring (memory, CPU, fd)
hdrhistogram = "7.5"      # Accurate latency percentiles
dhat = "0.3.3"
byteorder = "1.5.0"

[features]
default = ["simd"]
# SIMD optimizations using std::simd (requires nightly)
simd = []
# Enable cloud storage backend support (S3, GCS, Azure, R2, MinIO)
# Default: LocalStorage only (zero overhead)
# With feature: ObjectStoreBackend + cloud providers
object-store = ["dep:object_store", "dep:url", "dep:futures"]
# Enable baseline benchmark dependencies (RocksDB, sled, fjall)
# Only needed when running comparative benchmarks, not for regular tests
baseline-benchmarks = ["dep:rocksdb", "dep:sled", "dep:fjall"]
# Enable dhat heap profiling (disables jemalloc to avoid conflicts)
dhat-heap = []
# Note: io_uring support can be added later as opt-in (security concerns)

[[bench]]
name = "sstable_bench"
harness = false

[[bench]]
name = "simd_profiling"
harness = false

[[bench]]
name = "background_compaction"
harness = false

[[bench]]
name = "storage_overhead"
harness = false

[[bench]]
name = "block_parsing"
harness = false

[[bench]]
name = "varint_comparison"
harness = false

[[bench]]
name = "buffer_pool_bench"
harness = false

[[bench]]
name = "zero_copy_bench"
harness = false

[[bench]]
name = "bloom_blocked"
harness = false

[[bench]]
name = "simd_search_comparison"
harness = false

[[bench]]
name = "micro_opt_read_bench"
harness = false

[[bench]]
name = "micro_opt_write_bench"
harness = false

[[bench]]
name = "micro_opt_scan_bench"
harness = false

[[bench]]
name = "sharded_buffer_pool_bench"
harness = false

[[bench]]
name = "pipelined_wal_bench"
harness = false

[[bench]]
name = "recovery_bench"
harness = false

[[bench]]
name = "mixed_workload"
harness = false

[[bench]]
name = "write_amplification"
harness = false

[[bench]]
name = "omendb_simulation"
harness = false

[[bench]]
name = "transaction_bench"
harness = false

# Examples that require optional features
[[example]]
name = "baseline_benchmark"
required-features = ["baseline-benchmarks"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = true  # Enable debug symbols for profiling
