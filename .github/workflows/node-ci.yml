name: Node CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to npm"
        required: false
        type: boolean
        default: false
      dry-run:
        description: "Dry run (build but don't publish)"
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Install dependencies
        run: npm install
        working-directory: node

      - name: Build
        run: npm run build
        working-directory: node

      - name: Test
        run: npm test
        working-directory: node

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            build: |
              npm run build -- --target x86_64-apple-darwin
              strip -x *.node
          - os: macos-latest
            target: aarch64-apple-darwin
            build: |
              sudo rm -Rf /Library/Developer/CommandLineTools/SDKs/*
              export CC=$(xcrun -f clang)
              export CXX=$(xcrun -f clang++)
              SYSROOT=$(xcrun --sdk macosx --show-sdk-path)
              export CFLAGS="-isysroot $SYSROOT -isystem $SYSROOT"
              npm run build -- --target aarch64-apple-darwin
              strip -x *.node
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: |
              npm run build -- --target x86_64-unknown-linux-gnu --use-napi-cross
              llvm-strip -x *.node
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build: |
              npm run build -- --target aarch64-unknown-linux-gnu --use-napi-cross
              llvm-strip -x *.node
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            build: npm run build -- --target x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: npm install
        working-directory: node

      - name: Build
        run: ${{ matrix.build }}
        shell: bash
        working-directory: node

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: node/*.node
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm install
        working-directory: node

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: node/artifacts

      - name: Move artifacts
        run: |
          npm exec napi artifacts
        working-directory: node

      - name: List packages
        run: ls -R npm
        working-directory: node

      - name: Publish @omendb/omendb
        run: npm publish --provenance --access public
        working-directory: node

      - name: Publish omendb wrapper
        run: npm publish --provenance --access public
        working-directory: node/wrapper
