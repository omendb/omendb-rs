name: Node CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Install dependencies
        run: npm install
        working-directory: node

      - name: Build
        run: npm run build
        working-directory: node

      - name: Test
        run: npm test
        working-directory: node
