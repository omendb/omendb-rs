name: Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build only, don't publish"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pin toolchain version - must match rust-toolchain.toml
  RUST_TOOLCHAIN: nightly-2025-12-04

jobs:
  # ============================================================================
  # STAGE 1: Quick verification (same checks as CI)
  # ============================================================================

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate versions
        run: |
          set -e

          # Get code versions
          CARGO_V=$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)
          PYTHON_V=$(grep '^version = ' python/Cargo.toml | head -1 | cut -d'"' -f2)
          NODE_V=$(jq -r .version node/package.json)

          echo "Code versions:"
          echo "  Cargo.toml:        $CARGO_V"
          echo "  python/Cargo.toml: $PYTHON_V"
          echo "  node/package.json: $NODE_V"

          # All code versions must match
          if [ "$CARGO_V" != "$PYTHON_V" ] || [ "$CARGO_V" != "$NODE_V" ]; then
            echo "ERROR: Version mismatch between files!"
            exit 1
          fi

          # Get published versions
          PYPI_V=$(curl -sf https://pypi.org/pypi/omendb/json | jq -r '.releases | keys | sort_by(split(".") | map(tonumber)) | .[-1]' || echo "0.0.0")
          CRATES_V=$(curl -sf https://crates.io/api/v1/crates/omendb | jq -r '.versions[0].num' || echo "0.0.0")

          echo ""
          echo "Published versions:"
          echo "  PyPI:     $PYPI_V"
          echo "  crates:   $CRATES_V"

          # Version must be higher than published
          if [ "$CARGO_V" = "$PYPI_V" ]; then
            echo "ERROR: Version $CARGO_V already published to PyPI"
            exit 1
          fi
          if [ "$CARGO_V" = "$CRATES_V" ]; then
            echo "ERROR: Version $CARGO_V already published to crates.io"
            exit 1
          fi

          # Check sequential (simplified: just ensure it's higher)
          BASE_V="$PYPI_V"
          IFS='.' read -r B_MAJ B_MIN B_PAT <<< "$BASE_V"
          IFS='.' read -r N_MAJ N_MIN N_PAT <<< "$CARGO_V"

          VALID=false
          [ "$N_MAJ" -gt "$B_MAJ" ] && VALID=true
          [ "$N_MAJ" -eq "$B_MAJ" ] && [ "$N_MIN" -gt "$B_MIN" ] && VALID=true
          [ "$N_MAJ" -eq "$B_MAJ" ] && [ "$N_MIN" -eq "$B_MIN" ] && [ "$N_PAT" -gt "$B_PAT" ] && VALID=true

          if [ "$VALID" = "false" ]; then
            echo "ERROR: Version $CARGO_V is not higher than published $BASE_V"
            exit 1
          fi

          echo ""
          echo "Version validation passed: $BASE_V -> $CARGO_V"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Test
        run: cargo test --lib

  # ============================================================================
  # STAGE 2: Build all artifacts (parallel, fail-fast)
  # ============================================================================

  build-python-linux:
    needs: [verify]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: true
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter -m python/Cargo.toml
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  build-python-macos:
    needs: [verify]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-13
            target: x86_64
          - runner: macos-14
            target: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter -m python/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  build-python-sdist:
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m python/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  build-node:
    needs: [verify]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            build: |
              npm run build -- --target x86_64-apple-darwin --platform
              strip -x *.node
          - os: macos-latest
            target: aarch64-apple-darwin
            build: |
              sudo rm -Rf /Library/Developer/CommandLineTools/SDKs/*
              export CC=$(xcrun -f clang)
              export CXX=$(xcrun -f clang++)
              SYSROOT=$(xcrun --sdk macosx --show-sdk-path)
              export CFLAGS="-isysroot $SYSROOT -isystem $SYSROOT"
              npm run build -- --target aarch64-apple-darwin --platform
              strip -x *.node
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: npm run build -- --target x86_64-unknown-linux-gnu --platform --use-napi-cross
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build: npm run build -- --target aarch64-unknown-linux-gnu --platform --use-napi-cross
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - run: npm install
        working-directory: node
      - run: ${{ matrix.build }}
        shell: bash
        working-directory: node
      - uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.target }}
          path: node/*.node
          if-no-files-found: error

  # ============================================================================
  # STAGE 3: Publish (sequential, only after ALL builds pass, skip if dry-run)
  # ============================================================================

  publish-crates:
    needs:
      [build-python-linux, build-python-macos, build-python-sdist, build-node]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Get crates.io token via OIDC
        uses: rust-lang/crates-io-auth-action@v1
        id: crates-io-auth
      - name: Publish to crates.io
        continue-on-error: true
        run: cargo publish --token ${{ steps.crates-io-auth.outputs.token }}

  publish-pypi:
    needs: [publish-crates]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: List wheels
        run: ls -la dist/
      - name: Publish to PyPI
        continue-on-error: true
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*

  publish-npm:
    needs: [publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@latest
      - run: npm install
        working-directory: node

      - uses: actions/download-artifact@v4
        with:
          pattern: node-*
          path: node/artifacts

      - name: Setup artifacts
        run: |
          for dir in artifacts/node-*/; do
            target=$(basename "$dir" | sed 's/node-//')
            mkdir -p "artifacts/bindings-$target"
            cp "$dir"*.node "artifacts/bindings-$target/"
          done
          ls -R artifacts/
        working-directory: node

      - name: Create npm packages
        run: npm exec napi create-npm-dirs -- --npm-dir npm
        working-directory: node

      - name: Move artifacts to packages
        run: npm exec napi artifacts -- --output-dir ./artifacts --npm-dir ./npm
        working-directory: node

      - name: Determine npm tag
        id: npm-tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *"-"* ]]; then
            echo "tag=--tag alpha" >> $GITHUB_OUTPUT
          else
            echo "tag=" >> $GITHUB_OUTPUT
          fi
        working-directory: node

      - name: Publish platform packages
        continue-on-error: true
        run: |
          for dir in npm/*/; do
            echo "Publishing $dir"
            npm publish "$dir" --provenance --access public ${{ steps.npm-tag.outputs.tag }} || true
          done
        working-directory: node

      - name: Publish @omendb/omendb
        continue-on-error: true
        run: npm publish --provenance --access public ${{ steps.npm-tag.outputs.tag }}
        working-directory: node

      - name: Publish omendb wrapper
        continue-on-error: true
        run: npm publish --provenance --access public ${{ steps.npm-tag.outputs.tag }}
        working-directory: node/wrapper
