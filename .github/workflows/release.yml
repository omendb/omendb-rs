name: Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build only, don't publish"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: nightly-2025-12-04

jobs:
  # ============================================================================
  # STAGE 1: Verify VERSION file matches all package files
  # ============================================================================

  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify all versions match VERSION file
        id: version
        run: |
          set -e
          VERSION=$(cat VERSION | tr -d '\n')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION file: $VERSION"
          echo ""

          # Check all 8 version locations match VERSION
          ERRORS=0

          CARGO_V=$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)
          PYTHON_V=$(grep '^version = ' python/Cargo.toml | head -1 | cut -d'"' -f2)
          INIT_V=$(grep '__version__' python/omendb/__init__.py | cut -d'"' -f2)
          FFI_V=$(grep '^version = ' omendb-ffi/Cargo.toml | head -1 | cut -d'"' -f2)
          NODE_CARGO_V=$(grep '^version = ' node/Cargo.toml | head -1 | cut -d'"' -f2)
          NODE_V=$(jq -r .version node/package.json)
          NODE_OPT=$(jq -r '.optionalDependencies["@omendb/omendb-darwin-arm64"]' node/package.json)
          WRAPPER_V=$(jq -r .version node/wrapper/package.json)
          WRAPPER_DEP=$(jq -r '.dependencies["@omendb/omendb"]' node/wrapper/package.json)

          echo "Checking versions against VERSION file ($VERSION):"

          check_version() {
            local file=$1
            local actual=$2
            if [ "$actual" = "$VERSION" ]; then
              echo "  [OK] $file: $actual"
            else
              echo "  [MISMATCH] $file: $actual (expected $VERSION)"
              ERRORS=$((ERRORS + 1))
            fi
          }

          check_version "Cargo.toml (version)" "$CARGO_V"
          check_version "python/Cargo.toml" "$PYTHON_V"
          check_version "python/omendb/__init__.py" "$INIT_V"
          check_version "omendb-ffi/Cargo.toml" "$FFI_V"
          check_version "node/Cargo.toml" "$NODE_CARGO_V"
          check_version "node/package.json" "$NODE_V"
          check_version "node/package.json (optionalDeps)" "$NODE_OPT"
          check_version "node/wrapper version" "$WRAPPER_V"
          check_version "node/wrapper @omendb" "$WRAPPER_DEP"

          if [ "$ERRORS" -gt 0 ]; then
            echo ""
            echo "ERROR: $ERRORS version mismatch(es) found!"
            echo ""
            echo "Fix locally: ./scripts/sync-version.sh"
            exit 1
          fi

          echo ""
          echo "All 8 version locations match: $VERSION"

      - name: Check not already published
        run: |
          VERSION=${{ steps.version.outputs.version }}

          PYPI_V=$(curl -sf https://pypi.org/pypi/omendb/json | jq -r '.info.version' || echo "0.0.0")
          CRATES_V=$(curl -sf https://crates.io/api/v1/crates/omendb | jq -r '.versions[0].num' || echo "0.0.0")

          echo "Published versions:"
          echo "  PyPI:      $PYPI_V"
          echo "  crates.io: $CRATES_V"
          echo ""

          if [ "$VERSION" = "$PYPI_V" ]; then
            echo "ERROR: Version $VERSION already published to PyPI"
            exit 1
          fi
          if [ "$VERSION" = "$CRATES_V" ]; then
            echo "ERROR: Version $VERSION already published to crates.io"
            exit 1
          fi

          echo "Version $VERSION is new - proceeding with release"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Test
        run: cargo test --lib

  # ============================================================================
  # STAGE 1.5: Recall Validation (runs PARALLEL with builds)
  # ============================================================================

  validate:
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        working-directory: python
        run: uv sync

      - name: Build
        working-directory: python
        run: uv run maturin develop --release

      - name: Release validation
        working-directory: python
        run: uv run python ../benchmarks/release_validation.py
        timeout-minutes: 10

  # ============================================================================
  # STAGE 1.75: Language test suites
  # ============================================================================

  test-python:
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        working-directory: python
        run: uv sync

      - name: Build
        working-directory: python
        run: uv run maturin develop --release

      - name: Test
        working-directory: python
        run: uv run pytest tests/ -x

  test-node:
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install dependencies
        working-directory: node
        run: npm install

      - name: Build
        working-directory: node
        run: npm run build

      - name: Test
        working-directory: node
        run: npm test

  examples:
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run examples
        run: ./scripts/verify-examples.sh

  # ============================================================================
  # STAGE 2: Build all artifacts (parallel, starts immediately after verify)
  # ============================================================================

  build-python-linux:
    needs: [verify]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: true
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter -m python/Cargo.toml
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  build-python-macos:
    needs: [verify]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-15
            target: x86_64
          - runner: macos-14
            target: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter -m python/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  build-python-windows:
    needs: [verify]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Build wheels (experimental)
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist --find-interpreter -m python/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x64
          path: dist

  build-python-sdist:
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m python/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  build-node:
    needs: [verify]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            build: |
              npm run build -- --target x86_64-apple-darwin --platform
              strip -x *.node
          - os: macos-latest
            target: aarch64-apple-darwin
            build: |
              sudo rm -Rf /Library/Developer/CommandLineTools/SDKs/*
              export CC=$(xcrun -f clang)
              export CXX=$(xcrun -f clang++)
              SYSROOT=$(xcrun --sdk macosx --show-sdk-path)
              export CFLAGS="-isysroot $SYSROOT -isystem $SYSROOT"
              npm run build -- --target aarch64-apple-darwin --platform
              strip -x *.node
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: npm run build -- --target x86_64-unknown-linux-gnu --platform --use-napi-cross
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build: npm run build -- --target aarch64-unknown-linux-gnu --platform --use-napi-cross
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            build: npm run build -- --target x86_64-pc-windows-msvc --platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - run: npm install
        working-directory: node
      - run: ${{ matrix.build }}
        shell: bash
        working-directory: node
      - uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.target }}
          path: node/*.node
          if-no-files-found: error

  # ============================================================================
  # STAGE 3: Publish (waits for builds AND validation)
  # ============================================================================

  publish-crates:
    needs:
      [
        verify,
        validate,
        test-python,
        test-node,
        examples,
        build-python-linux,
        build-python-macos,
        build-python-windows,
        build-python-sdist,
        build-node,
      ]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Get crates.io token via OIDC
        uses: rust-lang/crates-io-auth-action@v1
        id: crates-io-auth
      - name: Publish omendb to crates.io
        run: cargo publish -p omendb --token ${{ steps.crates-io-auth.outputs.token }}

  publish-crates-ffi:
    needs: [verify, publish-crates]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Wait for crates.io index
        run: |
          VERSION=${{ needs.verify.outputs.version }}
          echo "Waiting for omendb $VERSION to appear in crates.io index..."
          for i in {1..30}; do
            if curl -sf "https://crates.io/api/v1/crates/omendb/$VERSION" > /dev/null 2>&1; then
              echo "omendb $VERSION found in index"
              exit 0
            fi
            echo "Attempt $i/30 - waiting 10s..."
            sleep 10
          done
          echo "Timeout waiting for crates.io index"
          exit 1
      - name: Get crates.io token via OIDC
        uses: rust-lang/crates-io-auth-action@v1
        id: crates-io-auth
      - name: Publish omendb-ffi to crates.io
        working-directory: omendb-ffi
        run: cargo publish --token ${{ steps.crates-io-auth.outputs.token }}

  publish-pypi:
    needs:
      [
        verify,
        validate,
        test-python,
        test-node,
        examples,
        build-python-linux,
        build-python-macos,
        build-python-windows,
        build-python-sdist,
        build-node,
      ]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: List wheels
        run: ls -la dist/
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*

  publish-npm:
    needs:
      [
        verify,
        validate,
        test-python,
        test-node,
        examples,
        build-python-linux,
        build-python-macos,
        build-python-windows,
        build-python-sdist,
        build-node,
      ]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@latest
      - run: npm install
        working-directory: node

      - uses: actions/download-artifact@v4
        with:
          pattern: node-*
          path: node/artifacts

      - name: Setup artifacts
        run: |
          for dir in artifacts/node-*/; do
            target=$(basename "$dir" | sed 's/node-//')
            mkdir -p "artifacts/bindings-$target"
            cp "$dir"*.node "artifacts/bindings-$target/"
          done
          ls -R artifacts/
        working-directory: node

      - name: Create npm packages
        run: npm exec napi create-npm-dirs -- --npm-dir npm
        working-directory: node

      - name: Move artifacts to packages
        run: npm exec napi artifacts -- --output-dir ./artifacts --npm-dir ./npm
        working-directory: node

      - name: Determine npm tag
        id: npm-tag
        run: |
          VERSION=${{ needs.verify.outputs.version }}
          if [[ "$VERSION" == *"-"* ]]; then
            echo "tag=--tag alpha" >> $GITHUB_OUTPUT
          else
            echo "tag=" >> $GITHUB_OUTPUT
          fi

      - name: Check npm version
        id: npm-skip
        run: |
          VERSION=${{ needs.verify.outputs.version }}
          PUBLISHED=$(npm view @omendb/omendb version || echo "")
          if [ "$PUBLISHED" = "$VERSION" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Version $VERSION already published to npm; skipping npm publish."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish platform packages
        if: steps.npm-skip.outputs.skip != 'true'
        run: |
          for dir in npm/*/; do
            echo "Publishing $dir"
            npm publish "$dir" --provenance --access public ${{ steps.npm-tag.outputs.tag }}
          done
        working-directory: node

      - name: Publish @omendb/omendb
        if: steps.npm-skip.outputs.skip != 'true'
        run: npm publish --provenance --access public ${{ steps.npm-tag.outputs.tag }}
        working-directory: node

      - name: Publish omendb wrapper
        if: steps.npm-skip.outputs.skip != 'true'
        run: npm publish --provenance --access public ${{ steps.npm-tag.outputs.tag }}
        working-directory: node/wrapper

  # ============================================================================
  # STAGE 4: Create git tag and GitHub release
  # ============================================================================

  create-release:
    needs:
      [verify, publish-crates, publish-crates-ffi, publish-pypi, publish-npm]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v${{ needs.verify.outputs.version }}"
          echo "Creating release $VERSION"
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            --latest
