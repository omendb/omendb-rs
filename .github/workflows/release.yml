name: Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build only, don't publish"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: nightly-2025-12-04

jobs:
  # ============================================================================
  # STAGE 1: Verify VERSION file matches all package files
  # ============================================================================

  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      pypi_published: ${{ steps.published.outputs.pypi_published }}
      npm_published: ${{ steps.published.outputs.npm_published }}
    steps:
      - uses: actions/checkout@v5

      - name: Verify all versions match VERSION file
        id: version
        run: |
          set -e
          VERSION=$(cat VERSION | tr -d '\n')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION file: $VERSION"
          echo ""

          # Check all 8 version locations match VERSION
          ERRORS=0

          CARGO_V=$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)
          PYTHON_V=$(grep '^version = ' python/Cargo.toml | head -1 | cut -d'"' -f2)
          INIT_V=$(grep '__version__' python/omendb/__init__.py | cut -d'"' -f2)
          FFI_V=$(grep '^version = ' omendb-ffi/Cargo.toml | head -1 | cut -d'"' -f2)
          NODE_CARGO_V=$(grep '^version = ' node/Cargo.toml | head -1 | cut -d'"' -f2)
          NODE_V=$(jq -r .version node/package.json)
          NODE_OPT=$(jq -r '.optionalDependencies["@omendb/omendb-darwin-arm64"]' node/package.json)
          WRAPPER_V=$(jq -r .version node/wrapper/package.json)
          WRAPPER_DEP=$(jq -r '.dependencies["@omendb/omendb"]' node/wrapper/package.json)

          echo "Checking versions against VERSION file ($VERSION):"

          check_version() {
            local file=$1
            local actual=$2
            if [ "$actual" = "$VERSION" ]; then
              echo "  [OK] $file: $actual"
            else
              echo "  [MISMATCH] $file: $actual (expected $VERSION)"
              ERRORS=$((ERRORS + 1))
            fi
          }

          check_version "Cargo.toml (version)" "$CARGO_V"
          check_version "python/Cargo.toml" "$PYTHON_V"
          check_version "python/omendb/__init__.py" "$INIT_V"
          check_version "omendb-ffi/Cargo.toml" "$FFI_V"
          check_version "node/Cargo.toml" "$NODE_CARGO_V"
          check_version "node/package.json" "$NODE_V"
          check_version "node/package.json (optionalDeps)" "$NODE_OPT"
          check_version "node/wrapper version" "$WRAPPER_V"
          check_version "node/wrapper @omendb" "$WRAPPER_DEP"

          if [ "$ERRORS" -gt 0 ]; then
            echo ""
            echo "ERROR: $ERRORS version mismatch(es) found!"
            echo ""
            echo "Fix locally: ./scripts/sync-version.sh"
            exit 1
          fi

          echo ""
          echo "All 8 version locations match: $VERSION"

      - name: Check already published
        id: published
        run: |
          VERSION=${{ steps.version.outputs.version }}

          PYPI_V=$(curl -sf https://pypi.org/pypi/omendb/json | jq -r '.info.version' || echo "0.0.0")
          CRATES_V=$(curl -sf https://crates.io/api/v1/crates/omendb | jq -r '.versions[0].num' || echo "0.0.0")
          NPM_V=$(curl -sf https://registry.npmjs.org/@omendb/omendb | jq -r '.["dist-tags"].latest' || echo "0.0.0")

          echo "Published versions:"
          echo "  PyPI:      $PYPI_V"
          echo "  crates.io: $CRATES_V"
          echo "  npm:       $NPM_V"
          echo ""

          PYPI_PUBLISHED=false
          if [ "$VERSION" = "$PYPI_V" ]; then
            echo "WARNING: Version $VERSION already published to PyPI"
            PYPI_PUBLISHED=true
          fi

          if [ "$VERSION" = "$CRATES_V" ]; then
            echo "WARNING: Version $VERSION already published to crates.io"
          fi

          NPM_PUBLISHED=false
          if [ "$VERSION" = "$NPM_V" ]; then
            echo "WARNING: Version $VERSION already published to npm"
            NPM_PUBLISHED=true
          fi

          echo "pypi_published=$PYPI_PUBLISHED" >> $GITHUB_OUTPUT
          echo "npm_published=$NPM_PUBLISHED" >> $GITHUB_OUTPUT

          echo "Proceeding with release"

      - name: Verify release notes exist
        run: ./scripts/release-notes.sh "${{ steps.version.outputs.version }}" --body-only >/tmp/release-notes.md

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Test
        run: cargo test --lib -- --skip stress_

  # ============================================================================
  # STAGE 1.5: Recall Validation (runs PARALLEL with builds)
  # ============================================================================

  validate:
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7.5.0

      - name: Install dependencies
        working-directory: python
        run: uv sync

      - name: Build
        working-directory: python
        run: uv run maturin develop --release

      - name: Release validation
        working-directory: python
        run: uv run python ../benchmarks/release_validation.py
        timeout-minutes: 10

  # ============================================================================
  # STAGE 1.75: Language test suites
  # ============================================================================

  test-python:
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7.5.0

      - name: Install dependencies
        working-directory: python
        run: uv sync

      - name: Build
        working-directory: python
        run: uv run maturin develop --release

      - name: Test
        working-directory: python
        run: uv run pytest tests/ -x -m "not slow and not soak"

  test-node:
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install dependencies
        working-directory: node
        run: npm install

      - name: Build
        working-directory: node
        run: npm run build

      - name: Test
        working-directory: node
        run: npm test

  examples:
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7.5.0

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Run examples
        run: ./scripts/verify-examples.sh

  # ============================================================================
  # STAGE 2: Build all artifacts (parallel, starts immediately after verify)
  # ============================================================================

  build-python-linux:
    needs: [verify]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: true
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v5

      - name: Check PyPI publish
        id: pypi-skip
        shell: bash
        run: |
          if [ "${{ needs.verify.outputs.pypi_published }}" = "true" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "PyPI already has version; skipping wheel build."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-python@v6
        if: steps.pypi-skip.outputs.skip != 'true'
        with:
          python-version: 3.x
      - name: Build wheels
        if: steps.pypi-skip.outputs.skip != 'true'
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter -m python/Cargo.toml
          manylinux: auto
      - uses: actions/upload-artifact@v4
        if: steps.pypi-skip.outputs.skip != 'true'
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  build-python-macos:
    needs: [verify]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-15
            target: x86_64
          - runner: macos-14
            target: aarch64
    steps:
      - uses: actions/checkout@v5

      - name: Check PyPI publish
        id: pypi-skip
        run: |
          if [ "${{ needs.verify.outputs.pypi_published }}" = "true" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "PyPI already has version; skipping wheel build."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-python@v6
        if: steps.pypi-skip.outputs.skip != 'true'
        with:
          python-version: 3.x
      - name: Build wheels
        if: steps.pypi-skip.outputs.skip != 'true'
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter -m python/Cargo.toml
      - uses: actions/upload-artifact@v4
        if: steps.pypi-skip.outputs.skip != 'true'
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  build-python-windows:
    needs: [verify]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Check PyPI publish
        id: pypi-skip
        run: |
          if [ "${{ needs.verify.outputs.pypi_published }}" = "true" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "PyPI already has version; skipping wheel build."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-python@v6
        if: steps.pypi-skip.outputs.skip != 'true'
        with:
          python-version: 3.x
      - name: Build wheels (experimental)
        if: steps.pypi-skip.outputs.skip != 'true'
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist --find-interpreter -m python/Cargo.toml
      - uses: actions/upload-artifact@v4
        if: steps.pypi-skip.outputs.skip != 'true'
        with:
          name: wheels-windows-x64
          path: dist

  build-python-sdist:
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check PyPI publish
        id: pypi-skip
        run: |
          if [ "${{ needs.verify.outputs.pypi_published }}" = "true" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "PyPI already has version; skipping sdist build."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Build sdist
        if: steps.pypi-skip.outputs.skip != 'true'
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m python/Cargo.toml
      - uses: actions/upload-artifact@v4
        if: steps.pypi-skip.outputs.skip != 'true'
        with:
          name: wheels-sdist
          path: dist

  build-node:
    needs: [verify]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            build: |
              npm run build -- --target x86_64-apple-darwin --platform
              strip -x *.node
          - os: macos-latest
            target: aarch64-apple-darwin
            build: |
              sudo rm -Rf /Library/Developer/CommandLineTools/SDKs/*
              export CC=$(xcrun -f clang)
              export CXX=$(xcrun -f clang++)
              SYSROOT=$(xcrun --sdk macosx --show-sdk-path)
              export CFLAGS="-isysroot $SYSROOT -isystem $SYSROOT"
              npm run build -- --target aarch64-apple-darwin --platform
              strip -x *.node
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: npm run build -- --target x86_64-unknown-linux-gnu --platform --use-napi-cross
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build: npm run build -- --target aarch64-unknown-linux-gnu --platform --use-napi-cross
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            build: npm run build -- --target x86_64-pc-windows-msvc --platform
    steps:
      - uses: actions/checkout@v5

      - name: Check npm publish
        id: npm-skip
        shell: bash
        run: |
          if [ "${{ needs.verify.outputs.npm_published }}" = "true" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "npm already has version; skipping node build."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-node@v6
        if: steps.npm-skip.outputs.skip != 'true'
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@master
        if: steps.npm-skip.outputs.skip != 'true'
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - run: npm install
        if: steps.npm-skip.outputs.skip != 'true'
        working-directory: node
      - run: ${{ matrix.build }}
        if: steps.npm-skip.outputs.skip != 'true'
        shell: bash
        working-directory: node
      - uses: actions/upload-artifact@v4
        if: steps.npm-skip.outputs.skip != 'true'
        with:
          name: node-${{ matrix.target }}
          path: node/*.node
          if-no-files-found: error

  # ============================================================================
  # STAGE 3: Publish (waits for builds AND validation)
  # ============================================================================

  publish-crates:
    needs:
      [
        verify,
        validate,
        test-python,
        test-node,
        examples,
        build-python-linux,
        build-python-macos,
        build-python-windows,
        build-python-sdist,
        build-node,
      ]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Get crates.io token via OIDC
        uses: rust-lang/crates-io-auth-action@v1
        id: crates-io-auth
      - name: Publish omendb to crates.io
        run: |
          set +e
          output=$(cargo publish -p omendb --token ${{ steps.crates-io-auth.outputs.token }} 2>&1)
          status=$?
          if [ "$status" -eq 0 ]; then
            echo "$output"
            exit 0
          fi
          if printf '%s' "$output" | grep -q "already exists on crates.io index"; then
            echo "$output"
            echo "omendb ${{ needs.verify.outputs.version }} already exists on crates.io; treating as success."
            exit 0
          fi
          echo "$output"
          exit $status

  publish-crates-ffi:
    needs: [publish-crates]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Wait for crates.io index propagation
        run: |
          echo "Waiting 30s for crates.io index to propagate..."
          sleep 30
      - name: Get crates.io token via OIDC
        uses: rust-lang/crates-io-auth-action@v1
        id: crates-io-auth
      - name: Publish omendb-ffi to crates.io
        working-directory: omendb-ffi
        run: |
          set +e
          output=$(cargo publish --token ${{ steps.crates-io-auth.outputs.token }} 2>&1)
          status=$?
          if [ "$status" -eq 0 ]; then
            echo "$output"
            exit 0
          fi
          if printf '%s' "$output" | grep -q "already exists on crates.io index"; then
            echo "$output"
            echo "omendb-ffi ${{ needs.verify.outputs.version }} already exists on crates.io; treating as success."
            exit 0
          fi
          echo "$output"
          exit $status

  publish-pypi:
    needs:
      [
        verify,
        validate,
        test-python,
        test-node,
        examples,
        build-python-linux,
        build-python-macos,
        build-python-windows,
        build-python-sdist,
        build-node,
      ]
    if: ${{ !inputs.dry-run && needs.verify.outputs.pypi_published != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: List wheels
        run: ls -la dist/
      - name: Check PyPI version
        id: pypi-skip
        run: |
          VERSION=${{ needs.verify.outputs.version }}
          PUBLISHED=$(curl -sf https://pypi.org/pypi/omendb/json | jq -r '.info.version' || echo "")
          if [ "$PUBLISHED" = "$VERSION" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Version $VERSION already published to PyPI; skipping publish."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to PyPI
        if: steps.pypi-skip.outputs.skip != 'true'
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*

  publish-npm:
    needs:
      [
        verify,
        validate,
        test-python,
        test-node,
        examples,
        build-python-linux,
        build-python-macos,
        build-python-windows,
        build-python-sdist,
        build-node,
      ]
    if: ${{ !inputs.dry-run && needs.verify.outputs.npm_published != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm install
        working-directory: node

      - uses: actions/download-artifact@v4
        with:
          pattern: node-*
          path: node/artifacts

      - name: Setup artifacts
        run: |
          for dir in artifacts/node-*/; do
            target=$(basename "$dir" | sed 's/node-//')
            mkdir -p "artifacts/bindings-$target"
            cp "$dir"*.node "artifacts/bindings-$target/"
          done
          ls -R artifacts/
        working-directory: node

      - name: Create npm packages
        run: npm exec napi create-npm-dirs -- --npm-dir npm
        working-directory: node

      - name: Move artifacts to packages
        run: npm exec napi artifacts -- --output-dir ./artifacts --npm-dir ./npm
        working-directory: node

      - name: Determine npm tag
        id: npm-tag
        run: |
          VERSION=${{ needs.verify.outputs.version }}
          if [[ "$VERSION" == *"-"* ]]; then
            echo "tag=--tag alpha" >> $GITHUB_OUTPUT
          else
            echo "tag=" >> $GITHUB_OUTPUT
          fi

      - name: Check npm version
        id: npm-skip
        run: |
          VERSION=${{ needs.verify.outputs.version }}
          PUBLISHED=$(npm view @omendb/omendb version || echo "")
          if [ "$PUBLISHED" = "$VERSION" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Version $VERSION already published to npm; skipping npm publish."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish platform packages
        if: steps.npm-skip.outputs.skip != 'true'
        run: |
          for dir in npm/*/; do
            echo "Publishing $dir"
            set +e
            output=$(npm publish "$dir" --provenance --access public ${{ steps.npm-tag.outputs.tag }} 2>&1)
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              echo "$output"
            elif echo "$output" | grep -q "cannot publish over the previously published"; then
              echo "$output"
              echo "Already published; continuing."
            else
              echo "$output"
              exit $status
            fi
          done
        working-directory: node

      - name: Publish @omendb/omendb
        if: steps.npm-skip.outputs.skip != 'true'
        run: |
          set +e
          output=$(npm publish --provenance --access public ${{ steps.npm-tag.outputs.tag }} 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "$output"
          elif echo "$output" | grep -q "cannot publish over the previously published"; then
            echo "$output"
            echo "Already published; continuing."
          else
            echo "$output"
            exit $status
          fi
        working-directory: node

      - name: Publish omendb wrapper
        if: steps.npm-skip.outputs.skip != 'true'
        run: |
          set +e
          output=$(npm publish --provenance --access public ${{ steps.npm-tag.outputs.tag }} 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "$output"
          elif echo "$output" | grep -q "cannot publish over the previously published"; then
            echo "$output"
            echo "Already published; continuing."
          else
            echo "$output"
            exit $status
          fi
        working-directory: node/wrapper

  # ============================================================================
  # STAGE 4: Tag and release
  # ============================================================================

  tag-release:
    needs:
      [verify, publish-crates, publish-crates-ffi, publish-pypi, publish-npm]
    if: >-
      always() &&
      !inputs.dry-run &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION="v${{ needs.verify.outputs.version }}"
          if git tag -l "$VERSION" | grep -q "$VERSION"; then
            echo "Tag $VERSION already exists"
            exit 0
          fi
          git tag -a "$VERSION" -m "$VERSION"
          git push origin "$VERSION"

  create-release:
    needs: [verify, tag-release]
    if: >-
      always() &&
      !inputs.dry-run &&
      needs.tag-release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Generate release notes
        run: ./scripts/release-notes.sh "${{ needs.verify.outputs.version }}" --body-only > release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v${{ needs.verify.outputs.version }}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists"
            exit 0
          fi
          echo "Creating release $VERSION"
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file release-notes.md \
            --latest
