name: Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build and test only, don't publish"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================================
  # STAGE 1: TESTS (parallel, fail-fast gate)
  # ============================================================================

  test-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - run: cargo test --lib
      - run: cargo clippy -- -D warnings

  test-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@nightly
      - run: npm install
        working-directory: node
      - run: npm run build
        working-directory: node
      - run: npm test
        working-directory: node

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync
        working-directory: python
      - name: Build
        run: uv run maturin develop --release
        working-directory: python
      - name: Test
        run: uv run pytest tests/test_basic.py tests/test_config.py -v --timeout=60
        working-directory: python

  # ============================================================================
  # STAGE 2: BUILDS (parallel, fail-fast, only after ALL tests pass)
  # ============================================================================

  build-python-linux:
    needs: [test-rust, test-node, test-python]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: true
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter -m python/Cargo.toml
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  build-python-macos:
    needs: [test-rust, test-node, test-python]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-13
            target: x86_64
          - runner: macos-14
            target: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter -m python/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  build-python-sdist:
    needs: [test-rust, test-node, test-python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m python/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  build-node:
    needs: [test-rust, test-node, test-python]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            build: |
              npm run build -- --target x86_64-apple-darwin --platform
              strip -x *.node
          - os: macos-latest
            target: aarch64-apple-darwin
            build: |
              sudo rm -Rf /Library/Developer/CommandLineTools/SDKs/*
              export CC=$(xcrun -f clang)
              export CXX=$(xcrun -f clang++)
              SYSROOT=$(xcrun --sdk macosx --show-sdk-path)
              export CFLAGS="-isysroot $SYSROOT -isystem $SYSROOT"
              npm run build -- --target aarch64-apple-darwin --platform
              strip -x *.node
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: npm run build -- --target x86_64-unknown-linux-gnu --platform --use-napi-cross
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build: npm run build -- --target aarch64-unknown-linux-gnu --platform --use-napi-cross
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}
      - run: npm install
        working-directory: node
      - run: ${{ matrix.build }}
        shell: bash
        working-directory: node
      - uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.target }}
          path: node/*.node
          if-no-files-found: error

  # ============================================================================
  # STAGE 3: PUBLISH (sequential, only after ALL builds pass, skip if dry-run)
  # ============================================================================

  publish-crates:
    needs:
      [build-python-linux, build-python-macos, build-python-sdist, build-node]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-pypi:
    needs: [publish-crates]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: List wheels
        run: ls -la dist/
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive dist/*

  publish-npm:
    needs: [publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@latest
      - run: npm install
        working-directory: node

      - uses: actions/download-artifact@v4
        with:
          pattern: node-*
          path: node/artifacts

      - name: Setup artifacts
        run: |
          for dir in artifacts/node-*/; do
            target=$(basename "$dir" | sed 's/node-//')
            mkdir -p "artifacts/bindings-$target"
            cp "$dir"*.node "artifacts/bindings-$target/"
          done
          ls -R artifacts/
        working-directory: node

      - name: Create npm packages
        run: npm exec napi create-npm-dirs -- --npm-dir npm
        working-directory: node

      - name: Move artifacts to packages
        run: npm exec napi artifacts -- --output-dir ./artifacts --npm-dir ./npm
        working-directory: node

      - name: Determine npm tag
        id: npm-tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *"-"* ]]; then
            echo "tag=--tag alpha" >> $GITHUB_OUTPUT
          else
            echo "tag=" >> $GITHUB_OUTPUT
          fi
        working-directory: node

      - name: Publish platform packages
        run: |
          for dir in npm/*/; do
            echo "Publishing $dir"
            npm publish "$dir" --provenance --access public ${{ steps.npm-tag.outputs.tag }}
          done
        working-directory: node

      - name: Publish @omendb/omendb
        run: npm publish --provenance --access public ${{ steps.npm-tag.outputs.tag }}
        working-directory: node

      - name: Publish omendb wrapper
        run: npm publish --provenance --access public ${{ steps.npm-tag.outputs.tag }}
        working-directory: node/wrapper
