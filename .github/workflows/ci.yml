name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Pin nightly for reproducibility (update monthly)
  RUST_NIGHTLY: nightly-2025-12-04

jobs:
  # ==========================================================================
  # Stage 1: Fast checks (parallel, fail fast on lint)
  # ==========================================================================

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - name: Format (FFI)
        working-directory: omendb-ffi
        run: cargo fmt --check

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (lib)
        run: |
          cargo clippy --lib -- \
            -D warnings \
            -D clippy::correctness \
            -W clippy::suspicious
      - name: Clippy (tests)
        run: |
          cargo clippy --tests -- \
            -D clippy::correctness \
            -W clippy::suspicious
      - name: Clippy (FFI)
        working-directory: omendb-ffi
        run: |
          cargo clippy --tests -- \
            -D warnings \
            -D clippy::correctness \
            -W clippy::suspicious

  # ==========================================================================
  # Stage 2: Rust tests (after lint passes)
  # ==========================================================================

  test:
    name: Test (Rust)
    runs-on: ${{ matrix.os }}
    needs: [fmt, clippy]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        run: cargo test --lib -- --skip stress_
        timeout-minutes: 15

  ffi:
    name: Test (FFI)
    runs-on: ${{ matrix.os }}
    needs: [fmt, clippy]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}
      - uses: Swatinem/rust-cache@v2
      - name: FFI tests
        working-directory: omendb-ffi
        run: cargo test
        timeout-minutes: 10

  proptest:
    name: Property Tests
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}
      - uses: Swatinem/rust-cache@v2
      - name: Property-based tests
        run: cargo test --lib proptest
        timeout-minutes: 15
        env:
          PROPTEST_CASES: 200

  # ==========================================================================
  # Stage 2: Python bindings (parallel with Rust tests)
  # ==========================================================================

  python:
    name: Test (Python)
    runs-on: ${{ matrix.os }}
    needs: [fmt, clippy]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7.5.0

      - name: Install dependencies
        working-directory: python
        run: uv sync

      - name: Check formatting (ruff)
        if: matrix.os == 'ubuntu-latest'
        working-directory: python
        run: uv run ruff format --check .

      - name: Lint (ruff)
        if: matrix.os == 'ubuntu-latest'
        working-directory: python
        run: uv run ruff check .

      - name: Build
        working-directory: python
        run: uv run maturin develop --release

      - name: Test
        working-directory: python
        run: uv run pytest tests/ -x --timeout=60 -m "not slow and not soak"

  durability:
    name: Test (Durability)
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7.5.0

      - name: Install dependencies
        working-directory: python
        run: uv sync

      - name: Build
        working-directory: python
        run: uv run maturin develop --release

      - name: Crash recovery tests
        working-directory: python
        run: uv run pytest tests/test_crash_recovery.py -x --timeout=120
        timeout-minutes: 20

  # ==========================================================================
  # Stage 2: Node.js bindings (parallel with Rust tests)
  # ==========================================================================

  node:
    name: Test (Node.js)
    runs-on: ${{ matrix.os }}
    needs: [fmt, clippy]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}

      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2.1.3

      - name: Install dependencies
        working-directory: node
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: node
        run: bun run build

      - name: Test
        working-directory: node
        run: bun test

  examples:
    name: Examples
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7.5.0

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Run examples
        run: ./scripts/verify-examples.sh
