name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - name: Run Rust tests
        run: cargo test --lib
      - name: Run clippy
        run: cargo clippy --lib

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        working-directory: python
        run: uv sync
      - name: Build and install
        working-directory: python
        run: uv run maturin develop --release
      - name: Run Python tests
        working-directory: python
        run: uv run pytest tests/test_basic.py tests/test_search.py tests/test_delete.py tests/test_insert.py tests/test_config.py tests/test_persistence.py -x --timeout=30
