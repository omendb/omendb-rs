name: Fuzzing

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Fuzz duration per target (seconds)"
        required: false
        default: "300"
        type: string
      target:
        description: "Specific target (or 'all')"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - db_operations
          - distance_ops
          - quantized_ops

env:
  CARGO_TERM_COLOR: always
  FUZZ_DURATION: ${{ inputs.duration || '300' }}

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    env:
      FUZZ_TARGET: ${{ matrix.target }}
      SELECTED_TARGET: ${{ inputs.target || 'all' }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - db_operations
          - distance_ops
          - quantized_ops
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Check if target selected
        id: check
        run: |
          if [ "$SELECTED_TARGET" = "all" ] || [ "$SELECTED_TARGET" = "$FUZZ_TARGET" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run fuzzer
        if: steps.check.outputs.run == 'true'
        run: |
          cd fuzz
          cargo +nightly fuzz run "$FUZZ_TARGET" -- \
            "-max_total_time=${FUZZ_DURATION}" \
            -max_len=65536
        timeout-minutes: 15

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crash-${{ matrix.target }}
          path: |
            fuzz/artifacts/${{ matrix.target }}
            fuzz/corpus/${{ matrix.target }}
          retention-days: 30

      - name: Upload corpus
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: corpus-${{ matrix.target }}
          path: fuzz/corpus/${{ matrix.target }}
          retention-days: 7
