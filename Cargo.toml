[workspace]
members = [".", "seerdb-vector"]
exclude = ["python"]
resolver = "2"

[package]
name = "omendb"
version = "0.0.1-alpha"
edition = "2021"
authors = ["OmenDB Inc."]
description = "Fast embedded vector database with HNSW + ACORN-1 filtered search"
repository = "https://github.com/omendb/omendb"
license = "AGPL-3.0"
keywords = ["vector-database", "embedded", "ai", "hnsw", "acorn"]
categories = ["database", "embedded"]
readme = "README.md"

[lib]
name = "omendb"
path = "src/lib.rs"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Parallel processing
rayon = "1.10"
parking_lot = "0.12"

# HNSW dependencies
ordered-float = "4.2"
lru = "0.12"
memmap2 = "0.9"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# WAL support
crc32fast = "1.4"
chrono = { version = "0.4", features = ["serde"] }

# Testing
tempfile = "3.8"
rand = "0.8"
rand_distr = "0.4"

# Utilities
lazy_static = "1.4"
once_cell = "1.19"

# Storage
seerdb = "0.0.2"
seerdb-vector = { path = "seerdb-vector" }

# Async (for seerdb)
tokio = { version = "1.48.0", features = ["full"] }

# Bit manipulation
fixedbitset = "0.5.7"

# Bytes (for storage)
bytes = "1.0"

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"
quickcheck = "1.0"

[features]
default = []
ffi = []           # Enable C FFI bindings
profile_search = []

[profile.release]
debug = true
