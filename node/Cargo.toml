[workspace]

[package]
name = "omendb-node"
version = "0.0.37"
edition = "2024"
license-file = "../LICENSE"
repository = "https://github.com/omendb/omendb"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["async", "tokio_rt", "serde-json"] }
napi-derive = "3"
omendb_lib = { package = "omendb", path = ".." }
parking_lot = "0.12"
serde_json = "1"
anyhow = "1"
tokio = { version = "1.48.0", features = ["rt"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
